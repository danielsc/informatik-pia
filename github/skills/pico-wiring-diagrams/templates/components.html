<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pico Workshop SVG Component Library</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      color: #172033;
      background: #eef2f7;
    }

    figure {
      max-width: 1280px;
      margin: 0 auto;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgb(15 23 42 / 10%);
    }

    figcaption {
      margin-top: 14px;
      line-height: 1.5;
    }

    code {
      padding: 0.1em 0.3em;
      background: #e2e8f0;
      border-radius: 4px;
    }

    @media print {
      body {
        padding: 0;
        background: white;
      }

      svg {
        border: 0;
        box-shadow: none;
      }
    }
  </style>
</head>

        resistor, LED, tactile button, potentiometer, eight-pixel RGB module,
        passive buzzer, S8050 transistor, and HC-SR04 ultrasonic sensor artwork
        used by the workshop wiring-diagram skill.
