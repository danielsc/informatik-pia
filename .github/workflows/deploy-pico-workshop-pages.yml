name: Deploy Pico workshop slides

on:
  push:
    branches:
      - master
    paths:
      - "Raspberry Pi Pico/Pico Python Workshop/**"
      - "AI/slides/**"
      - ".github/workflows/deploy-pico-workshop-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages website
        run: |
          mkdir -p _site/ai
          cp -R "Raspberry Pi Pico/Pico Python Workshop/." _site/
          cp -R AI/slides _site/ai/

      - name: Upload workshop website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
