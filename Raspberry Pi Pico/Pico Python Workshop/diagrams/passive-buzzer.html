      <title id="title">Raspberry Pi Pico passive buzzer driven safely by an S8050 transistor</title>
      <desc id="description">
        A canonical horizontal Raspberry Pi Pico drives an S8050 transistor base from GP15 through one kilohm. VBUS supplies the passive buzzer, its negative lead goes to the collector, and the emitter returns to common ground. Exact breadboard contacts and flat-face E B C orientation are shown.
